version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: Sasuke24
      POSTGRES_DB: helpdesk_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
  web:
    build: .
    environment:
      DB_HOST: db
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: Sasuke24
      POSTGRES_DB: helpdesk_db
      SECRET_KEY: cd1016d61b163f4c83b14c7bc3b87d95b6e4fbf5f525a84695e6e1d5c2c5d204
    expose:
      - "8000"
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
volumes:
  postgres_data: